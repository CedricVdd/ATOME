<title>Automatismes du jour — Terminale</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap');

:root{
  --bg:#16242A;
  --bg-2:#1E2F35;
  --line:rgba(241,238,228,0.10);
  --chalk:#F1EEE4;
  --chalk-dim:#AEBBB8;
  --teal:#5FC3B5;
  --teal-dim:#3A8B7F;
  --amber:#E8B84B;
  --paper:#FBF8F1;
  --paper-line:#D8D2C0;
  --ink:#22344A;
  --ink-dim:#5B6B80;
  --red-margin:#C1503F;
  --success:#4C9A6B;
  --success-bg:#DCEEE1;
  --radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;}
.wrap{max-width:640px;margin:0 auto;padding:0 0 4rem;}
.topbar{padding:1.4rem 1.25rem 1rem;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
.brand .bolt{color:var(--amber);font-size:20px;}

.hero{margin:0 1.25rem 1.25rem;background:var(--bg-2);border-radius:var(--radius);padding:1.3rem 1.4rem;position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle, rgba(95,195,181,0.12), transparent 70%);}
.hero .date{font-family:'Caveat',cursive;font-size:22px;color:var(--teal);margin:0 0 6px;}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:600;margin:0 0 12px;line-height:1.3;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;padding:4px 11px;border-radius:20px;background:rgba(95,195,181,0.14);color:var(--teal);border:1px solid rgba(95,195,181,0.25);font-weight:500;}

.section{margin:0 1.25rem 1.25rem;}
.label{font-size:12.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--chalk-dim);margin:0 0 8px;font-weight:600;}

.paper-card{
  background-image:linear-gradient(var(--paper-line) 1px, transparent 1px),linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
  background-size:22px 22px;background-color:var(--paper);border-radius:10px;padding:1.4rem 1.4rem 1.4rem 2.2rem;
  position:relative;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,0.25);
}
.paper-card::before{content:"";position:absolute;left:1.5rem;top:0;bottom:0;width:1.5px;background:var(--red-margin);opacity:0.55;}
.paper-card .type-badge{display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-dim);margin-bottom:8px;}
.paper-card .enonce{font-size:16.5px;line-height:1.55;font-weight:500;}

.photo-zone{border:1.5px dashed var(--line);border-radius:12px;padding:1.4rem;text-align:center;cursor:pointer;transition:border-color .15s ease;}
.photo-zone:hover{border-color:var(--teal-dim);}
.photo-zone .icon{font-size:26px;color:var(--teal);margin-bottom:6px;}
.photo-zone p{margin:0;font-size:13.5px;color:var(--chalk-dim);}
.thumb{width:100%;border-radius:10px;margin-top:12px;max-height:280px;object-fit:contain;background:#0e1a1e;}

.btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;padding:11px 18px;border-radius:9px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease, opacity .15s ease;width:100%;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--teal);color:#0C2621;}
.btn-primary:hover{background:#6FD0C2;}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}

.correction-card{background:var(--success-bg);border-left:4px solid var(--success);border-radius:12px;padding:1.1rem 1.2rem;margin-top:1rem;color:#1E4A31;}
.correction-card .cc-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;margin-bottom:6px;}
.correction-card p{margin:0;font-size:14.5px;line-height:1.55;}

.hidden{display:none !important;}

.progress-row{display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.progress-dots{display:flex;gap:6px;}
.progress-dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
.progress-dot.done{background:var(--teal);}
.progress-dot.current{background:var(--amber);}

.done-card{background:var(--bg-2);border-radius:12px;padding:1.6rem 1.4rem;text-align:center;}
.done-card .big{font-size:30px;margin-bottom:8px;}
.done-card p{margin:0;color:var(--chalk-dim);font-size:14.5px;}

.thumb{width:100%;border-radius:10px;margin-top:12px;max-height:280px;object-fit:contain;background:#0e1a1e;}
.spinner{
  width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);
  border-top-color:#0C2621;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.ai-feedback{border-radius:12px;padding:1.1rem 1.2rem;margin-top:1rem;border-left:4px solid;}
.ai-feedback.correct{background:var(--success-bg);border-color:var(--success);color:#1E4A31;}
.ai-feedback.partiel{background:#F4E7CC;border-color:#C08A2E;color:#4A3410;}
.ai-feedback.incorrect{background:#F6DEDA;border-color:#B7473A;color:#4A1D16;}
.ai-feedback .fb-status{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;margin-bottom:6px;}
.ai-feedback .fb-text{font-size:14.5px;line-height:1.55;margin:0 0 10px;}
.ai-feedback .fb-lu{font-size:12.5px;opacity:0.75;margin:0;border-top:1px solid rgba(0,0,0,0.12);padding-top:8px;}
.error-msg{color:#E8827A;font-size:13px;margin-top:8px;}

.access-gate{
  min-height:80vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
}
.access-card{
  background:var(--bg-2);border-radius:16px;padding:2rem 1.6rem;max-width:360px;width:100%;text-align:center;
}
.access-card .bolt-big{font-size:32px;margin-bottom:10px;}
.access-card h2{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 8px;}
.access-card p{color:var(--chalk-dim);font-size:13.5px;margin:0 0 18px;}
.access-input{
  background:var(--bg);border:1.5px solid var(--line);color:var(--chalk);
  border-radius:9px;padding:11px 14px;font-size:15px;font-family:'Inter',sans-serif;
  width:100%;text-align:center;margin-bottom:12px;box-sizing:border-box;
}
.access-input:focus{outline:none;border-color:var(--teal-dim);}
</style>
</head>
<body>

<div class="access-gate" id="accessGate">
  <div class="access-card">
    <div class="bolt-big">&#9889;</div>
    <h2>Automatismes du jour</h2>
    <p>Entre le code donné par ton professeur pour accéder aux questions.</p>
    <input type="text" id="accessCodeInput" class="access-input" placeholder="Code d'accès" autocomplete="off">
    <button class="btn btn-primary" id="accessSubmitBtn">Valider</button>
    <p class="error-msg hidden" id="accessError">Code incorrect, réessaie.</p>
  </div>
</div>

<div class="wrap hidden" id="appWrap">

  <div class="topbar">
    <div class="brand"><span class="bolt">&#9889;</span> Automatismes du jour</div>
  </div>

  <div class="hero">
    <p class="date" id="dateLabel"></p>
    <h1 id="heroTitle">C'est parti !</h1>
    <div class="chips" id="heroChips"></div>
  </div>

  <div class="section hidden" id="quizArea">

    <div class="section" style="margin:0 0 1.25rem;">
      <p class="label">La question</p>
      <div class="paper-card" id="questionCard"></div>
    </div>

    <div class="section" style="margin:0 0 1.25rem;" id="photoSection">
      <p class="label">Ta réponse</p>
      <div class="photo-zone" id="photoZone">
        <div class="icon">&#128247;</div>
        <p>Prends en photo ta réponse manuscrite</p>
        <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">
      </div>
      <img id="thumb" class="thumb hidden">
      <button class="btn btn-primary" id="sendBtn" style="margin-top:14px;" disabled>Envoyer pour correction</button>
      <p class="error-msg hidden" id="sendError"></p>
    </div>

    <div class="section hidden" style="margin:0;" id="correctionSection"></div>
  </div>

  <div class="section hidden" id="doneArea">
    <div class="done-card">
      <div class="big">&#127881;</div>
      <p>Bravo, tu as terminé les questions du jour !</p>
    </div>
  </div>

</div>

<script>
/*
  BANQUE DE QUESTIONS — Terminale
  ----------------------------------------------------
  Pour ajouter une question, copiez un bloc { ... } et modifiez le texte
  entre guillemets. N'oubliez pas la virgule à la fin de chaque bloc,
  sauf le tout dernier.

  type     : "formule", "calcul" ou "definition"
  theme    : le chapitre concerné (sert aussi à mélanger les thèmes)
  niveau   : laissez "Tle" (ce fichier est dédié à ce niveau)
  enonce   : la consigne donnée à l'élève
  reponse  : la réponse affichée pour l'autocorrection
  periode  : OPTIONNEL. Date "jj/mm" à partir de laquelle la question peut
             apparaître, comptée sur l'année scolaire en cours (1er
             septembre - 1er juillet). Exemple : periode:"23/10" -> la
             question ne sera jamais proposée avant le 23 octobre.
             Une question SANS ce champ est disponible dès le premier jour.

  Chaque jour, l'appli choisit automatiquement 5 questions différentes,
  en essayant de varier les thèmes, sans répéter celles des jours
  précédents tant que la banque n'est pas épuisée, et en ne piochant que
  parmi les questions déjà "ouvertes" à la date du jour.
*/
const QUESTIONS = [
  {type:"calcul", theme:"Mécanique - énergie", niveau:"Tle", enonce:"Calcule l'énergie cinétique d'un objet de masse 2 kg se déplaçant à 5 m/s.", reponse:"Ec = ½×m×v² = 0,5 × 2 × 5² = 25 J."},
  {type:"calcul", theme:"Ondes - son", niveau:"Tle", enonce:"Une onde sonore parcourt 340 m en 1 seconde. Calcule sa célérité.", reponse:"v = d / t = 340 / 1 = 340 m/s.", periode:"23/10"},
  {type:"formule", theme:"Chimie - pH", niveau:"Tle", enonce:"Écris la relation entre le pH et la concentration en ions oxonium [H3O+].", reponse:"pH = −log[H3O+], avec [H3O+] en mol/L."},
  {type:"formule", theme:"Mécanique - travail", niveau:"Tle", enonce:"Écris l'expression du travail d'une force constante colinéaire au déplacement.", reponse:"W(F) = F × d, avec W en joules (J), F en newtons (N), d en mètres (m)."},
  {type:"formule", theme:"Chimie - avancement", niveau:"Tle", enonce:"Écris la relation entre le taux d'avancement final τ, l'avancement final x_f et l'avancement maximal x_max.", reponse:"τ = x_f / x_max."},
  {type:"calcul", theme:"Chimie - avancement", niveau:"Tle", enonce:"Une réaction a un avancement maximal de 0,08 mol et un avancement final de 0,06 mol. Calcule le taux d'avancement final.", reponse:"τ = x_f / x_max = 0,06 / 0,08 = 0,75, soit 75 %."},
  {type:"calcul", theme:"Chimie - pH", niveau:"Tle", enonce:"Une solution a une concentration en ions oxonium de 1×10⁻³ mol/L. Calcule son pH.", reponse:"pH = −log[H3O+] = −log(1×10⁻³) = 3."},
  {type:"formule", theme:"Chimie - titrage", niveau:"Tle", enonce:"Pour un titrage avec une réaction 1:1 entre le réactif titrant et le réactif titré, écris la relation vérifiée à l'équivalence.", reponse:"Ctitrant × Vtitrant(équivalence) = Ctitré × Vtitré."},
  {type:"calcul", theme:"Chimie - titrage", niveau:"Tle", enonce:"On titre 20 mL d'une solution d'acide par une solution de soude à 0,1 mol/L. L'équivalence est atteinte pour un volume versé de 12 mL. Calcule la concentration de l'acide (réaction 1:1).", reponse:"Ca = (Ct × Vt éq) / Va = (0,1 × 0,012) / 0,020 = 0,06 mol/L."},
  {type:"calcul", theme:"Mouvement circulaire", niveau:"Tle", enonce:"Un point tourne sur un cercle de rayon 0,5 m à la vitesse constante de 2 m/s. Calcule la valeur de son accélération centripète.", reponse:"a = v² / R = 2² / 0,5 = 8 m/s²."},
  {type:"formule", theme:"Énergie - puissance", niveau:"Tle", enonce:"Écris la relation entre la puissance moyenne P, le travail W d'une force et la durée Δt.", reponse:"P = W / Δt, avec P en watts (W), W en joules (J), Δt en secondes (s)."},
  {type:"calcul", theme:"Énergie - puissance", niveau:"Tle", enonce:"Un moteur fournit un travail de 3000 J en 5 s. Calcule sa puissance moyenne.", reponse:"P = W / Δt = 3000 / 5 = 600 W."},
  {type:"formule", theme:"Ondes - interférences", niveau:"Tle", enonce:"Écris la condition d'interférence constructive entre deux ondes, en fonction de la différence de marche δ et de la longueur d'onde λ.", reponse:"δ = k × λ, avec k un entier relatif."},
  {type:"calcul", theme:"Ondes - diffraction", niveau:"Tle", enonce:"Une onde de longueur d'onde 500 nm traverse une fente de largeur 0,1 mm. Calcule l'écart angulaire de diffraction θ (en radians, avec θ ≈ λ/a).", reponse:"θ = λ / a = 500×10⁻⁹ / 0,1×10⁻³ = 5×10⁻³ rad."},
  {type:"formule", theme:"Ondes - effet Doppler", niveau:"Tle", enonce:"Écris l'expression simplifiée du décalage Doppler Δf en fonction de la fréquence émise f, la vitesse relative v de la source et la célérité c de l'onde (cas v ≪ c).", reponse:"Δf = f × v / c."},
  {type:"formule", theme:"Radioactivité", niveau:"Tle", enonce:"Écris la loi de décroissance radioactive donnant le nombre de noyaux N(t) en fonction du temps.", reponse:"N(t) = N₀ × e^(−λt), avec N₀ le nombre initial de noyaux et λ la constante radioactive."},
  {type:"calcul", theme:"Radioactivité", niveau:"Tle", enonce:"Un échantillon radioactif a une demi-vie de 8 jours. Au bout de 24 jours, quelle fraction des noyaux initiaux reste-t-il ?", reponse:"24 jours = 3 demi-vies, donc la fraction restante est (1/2)³ = 1/8."},
  {type:"formule", theme:"Chimie - gaz", niveau:"Tle", enonce:"Écris la relation entre le volume V d'un gaz, sa quantité de matière n et le volume molaire Vm.", reponse:"V = n × Vm, avec V en L, n en mol, Vm en L/mol."},
  {type:"calcul", theme:"Chimie - gaz", niveau:"Tle", enonce:"Calcule le volume occupé par 0,25 mol de gaz, avec un volume molaire de 24 L/mol.", reponse:"V = n × Vm = 0,25 × 24 = 6 L."},
  {type:"calcul", theme:"Mouvement", niveau:"Tle", enonce:"Une force résultante de 20 N s'applique sur un objet de masse 4 kg initialement au repos. Calcule la distance parcourue après 3 s.", reponse:"a = F/m = 20/4 = 5 m/s² ; d = ½×a×t² = 0,5×5×3² = 22,5 m."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation E = m × c², exprime m en fonction de E et c.", reponse:"m = E / c²."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation 1/f' = 1/OA' − 1/OA, exprime OA en fonction de f' et OA'.", reponse:"1/OA = 1/OA' − 1/f', donc OA = 1 / (1/OA' − 1/f')."},
  {type:"calcul", theme:"Automatismes maths - Puissances de 10", niveau:"Tle", enonce:"Simplifie (5×10⁻³)² et donne le résultat en notation scientifique.", reponse:"(5×10⁻³)² = 25×10⁻⁶ = 2,5×10⁻⁵."},
  {type:"calcul", theme:"Automatismes maths - Calcul à la calculatrice", niveau:"Tle", enonce:"Calcule (3,00×10⁸) / (6,58×10¹⁴) à la calculatrice, en notation scientifique.", reponse:"(3,00×10⁸) / (6,58×10¹⁴) ≈ 4,56×10⁻⁷."},
  {type:"calcul", theme:"Automatismes maths - Calculs vectoriels", niveau:"Tle", enonce:"Un vecteur vitesse a pour coordonnées (6 ; −8) en m/s. Calcule sa norme (la valeur de la vitesse).", reponse:"||v|| = √(6² + 8²) = √100 = 10 m/s."},
  {type:"calcul", theme:"Automatismes maths - Calculs vectoriels", niveau:"Tle", enonce:"Un vecteur force F a une norme de 10 N et fait un angle de 30° avec l'horizontale. Calcule sa composante horizontale Fx.", reponse:"Fx = F × cos(30°) = 10 × 0,866 ≈ 8,66 N."},
  {type:"calcul", theme:"Automatismes maths - Calculs vectoriels", niveau:"Tle", enonce:"Un vecteur force F a une norme de 10 N et fait un angle de 30° avec l'horizontale. Calcule sa composante verticale Fy.", reponse:"Fy = F × sin(30°) = 10 × 0,5 = 5 N."},
  {type:"calcul", theme:"Automatismes maths - Graphiques", niveau:"Tle", enonce:"Trace l'allure de la fonction f(x) = x² sur l'intervalle [−3 ; 3], en plaçant au moins 5 points.", reponse:"Une parabole symétrique par rapport à l'axe des ordonnées, passant par (0 ; 0), décroissante pour x<0 et croissante pour x>0, avec un minimum en x=0."},
  {type:"calcul", theme:"Automatismes maths - Graphiques", niveau:"Tle", enonce:"Sur un graphique représentant la position x(t) d'un mobile, la tangente à la courbe au point t=2 s a un coefficient directeur de 4. Que représente cette valeur physiquement ?", reponse:"Ce coefficient directeur représente la vitesse instantanée du mobile à t=2 s (dx/dt), ici égale à 4 dans l'unité correspondante (ex : m/s)."},
  {type:"calcul", theme:"Automatismes maths - Graphiques", niveau:"Tle", enonce:"Trace l'allure de la fonction f(t) = e^(−t) pour t ≥ 0, en indiquant sa valeur en t=0 et son comportement quand t tend vers l'infini.", reponse:"La courbe part de f(0) = 1, est strictement décroissante, et tend vers 0 sans jamais l'atteindre quand t tend vers l'infini."},
  {type:"calcul", theme:"Automatismes maths - Dérivées", niveau:"Tle", enonce:"Calcule la dérivée de la fonction f(t) = 5t³ − 2t.", reponse:"f'(t) = 15t² − 2."},
  {type:"calcul", theme:"Automatismes maths - Dérivées", niveau:"Tle", enonce:"Calcule la dérivée de la fonction f(x) = e^(2x).", reponse:"f'(x) = 2 × e^(2x)."},
  {type:"calcul", theme:"Automatismes maths - Dérivées", niveau:"Tle", enonce:"Calcule la dérivée de la fonction x(t) = A × cos(ωt), où A et ω sont des constantes.", reponse:"x'(t) = −A × ω × sin(ωt)."},
  {type:"calcul", theme:"Automatismes maths - Dérivées", niveau:"Tle", enonce:"La position d'un mobile est x(t) = 2t² + 3t. Calcule l'expression de sa vitesse v(t) = x'(t).", reponse:"v(t) = 4t + 3."},
  {type:"calcul", theme:"Automatismes maths - Équations différentielles", niveau:"Tle", enonce:"Donne la solution générale de l'équation différentielle dy/dt + y/τ = 0 (τ constante), avec y(0) = y0.", reponse:"y(t) = y0 × e^(−t/τ)."},
  {type:"calcul", theme:"Automatismes maths - Équations différentielles", niveau:"Tle", enonce:"L'équation différentielle régissant la décroissance radioactive s'écrit dN/dt = −λN. Donne l'expression de N(t) en fonction de N0 et λ.", reponse:"N(t) = N0 × e^(−λt)."},
  {type:"calcul", theme:"Automatismes maths - Équations différentielles", niveau:"Tle", enonce:"Pour la charge d'un condensateur dans un circuit RC, l'équation différentielle est RC × du/dt + u = E. Donne l'expression de u(t) sachant qu'à t=0, u=0.", reponse:"u(t) = E × (1 − e^(−t/RC))."},
  {type:"calcul", theme:"Automatismes maths - Équations différentielles", niveau:"Tle", enonce:"Vérifie que y(t) = 5×e^(−2t) est solution de l'équation différentielle dy/dt + 2y = 0.", reponse:"dy/dt = −10×e^(−2t) ; alors dy/dt + 2y = −10×e^(−2t) + 10×e^(−2t) = 0, donc y(t) est bien solution."},
  {type:"calcul", theme:"Automatismes maths - Équations différentielles", niveau:"Tle", enonce:"L'équation différentielle 2×dy/dt + y = 0 se met sous la forme τ×dy/dt + y = 0. Donne la valeur de la constante de temps τ.", reponse:"En divisant par 2 : dy/dt + y/2 = 0, donc τ = 2."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation pH = −log[H3O+], exprime [H3O+] en fonction du pH.", reponse:"[H3O+] = 10^(−pH)."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation N(t) = N0 × e^(−λt), exprime λ en fonction de N(t), N0 et t.", reponse:"λ = ln(N0 / N(t)) / t."},
  {type:"calcul", theme:"Automatismes maths - Conversion d'unités", niveau:"Tle", enonce:"Convertis 3,5 μs en secondes.", reponse:"3,5 μs = 3,5×10⁻⁶ s."},
  {type:"calcul", theme:"Automatismes maths - Conversion d'unités", niveau:"Tle", enonce:"Convertis 12 000 Hz en kHz.", reponse:"12 000 Hz = 12 kHz."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation V = n × Vm, exprime Vm en fonction de V et n.", reponse:"Vm = V / n."},
  {type:"calcul", theme:"Automatismes maths - Conversion d'unités", niveau:"Tle", enonce:"Convertis 6,2×10⁴ Pa en hPa (1 hPa = 100 Pa).", reponse:"6,2×10⁴ Pa = 620 hPa."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation τ = x_f / x_max, exprime x_max en fonction de τ et x_f.", reponse:"x_max = x_f / τ."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation τ = x_f / x_max, exprime x_f en fonction de τ et x_max.", reponse:"x_f = τ × x_max."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation W(F) = F × d, exprime F en fonction de W(F) et d.", reponse:"F = W(F) / d."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation W(F) = F × d, exprime d en fonction de W(F) et F.", reponse:"d = W(F) / F."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation P = W / Δt, exprime W en fonction de P et Δt.", reponse:"W = P × Δt."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation P = W / Δt, exprime Δt en fonction de P et W.", reponse:"Δt = W / P."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation V = n × Vm, exprime n en fonction de V et Vm.", reponse:"n = V / Vm."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation 1/f' = 1/OA' − 1/OA, exprime OA' en fonction de f' et OA.", reponse:"1/OA' = 1/f' + 1/OA, donc OA' = 1 / (1/f' + 1/OA)."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation Δf = f × v / c (effet Doppler), exprime v en fonction de Δf, f et c.", reponse:"v = Δf × c / f."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation Δf = f × v / c (effet Doppler), exprime f en fonction de Δf, v et c.", reponse:"f = Δf × c / v."},
  {type:"formule", theme:"Automatismes maths - Formules littérales", niveau:"Tle", enonce:"Dans la relation δ = k × λ (interférences), exprime λ en fonction de δ et k.", reponse:"λ = δ / k."},
  {type:"formule", theme:"Ondes", niveau:"Tle", enonce:"Écris la relation donnant l'énergie E d'un photon en fonction de la constante de Planck h et de la fréquence f.", reponse:"E = h × f."},

// Générateur pseudo-aléatoire déterministe (mêmes nombres pour tout le monde le même jour).
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randInt(rand, min, max){ return min + Math.floor(rand() * (max - min + 1)); }
function randStep(rand, min, max, step){
  const n = Math.floor((max - min) / step) + 1;
  return min + step * Math.floor(rand() * n);
}
function fmt(num, decimals){
  let s = num.toFixed(decimals);
  if(s.indexOf('.') !== -1){
    s = s.replace(/0+$/, '').replace(/\.$/, '');
  }
  return s.replace('.', ',');
}

// Convertit un nombre en écriture scientifique a×10^b (a entre 1 et 10),
// avec l'exposant écrit en exposant unicode (ex: 4,50×10⁻³).
function toScientificParts(num){
  const s = num.toExponential(2);
  const [mantissaStr, expStr] = s.split('e');
  return { mantissa: parseFloat(mantissaStr), exponent: parseInt(expStr, 10) };
}
function superscript(n){
  const map = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
  return String(n).split('').map(ch => map[ch] || ch).join('');
}
function sciNotation(num){
  const { mantissa, exponent } = toScientificParts(num);
  return `${fmt(mantissa, 2)}×10${superscript(exponent)}`;
}

// L'année scolaire commence le 1er septembre. Si on est entre janvier et
// août, elle a commencé le 1er septembre de l'année précédente.
function getSchoolYearStart(now){
  const year = now.getFullYear();
  const sept1ThisYear = new Date(year, 8, 1);
  return now >= sept1ThisYear ? sept1ThisYear : new Date(year - 1, 8, 1);
}

// Transforme une date "jj/mm" en vraie date, en la plaçant dans la bonne
// année civile selon l'année scolaire en cours (sept-déc -> même année que
// la rentrée, janv-juil -> année suivante).
function resolvePeriodeDate(schoolYearStart, periode){
  const parts = periode.split('/');
  const day = parseInt(parts[0], 10);
  const month = parseInt(parts[1], 10);
  const startYear = schoolYearStart.getFullYear();
  const calYear = (month >= 9) ? startYear : startYear + 1;
  return new Date(calYear, month - 1, day);
}

// Une question sans champ "periode" est toujours disponible. Avec un champ
// "periode", elle n'apparaît qu'à partir de cette date de l'année scolaire.
function isAvailable(q, now, schoolYearStart){
  if(!q.periode) return true;
  return now >= resolvePeriodeDate(schoolYearStart, q.periode);
}

// Chaque jour, 3 questions dans un ordre fixe : une manipulation algébrique
// littérale (formule), un calcul de conversion d'unité + écriture
// scientifique, un calcul mental sans calculatrice. La formule tourne dans
// l'ordre où elle est écrite dans la banque (QUESTIONS) ; les deux calculs
// sont régénérés avec des nombres nouveaux chaque jour, donc ils ne se
// répètent jamais vraiment. Les questions non encore ouvertes (champ
// "periode") sont ignorées.
function getTodayQuestions(){
  const epoch = new Date(2026, 0, 1);
  const now = new Date();
  const days = Math.floor((now - epoch) / 86400000);
  const schoolYearStart = getSchoolYearStart(now);

  const formules = QUESTIONS.filter(q => q.type === 'formule' && isAvailable(q, now, schoolYearStart));
  const calculTemplated = TEMPLATES_CALCUL.map((tpl, i) => tpl.build(mulberry32(days * 5000 + i + 1)));
  const mentalTemplated = TEMPLATES_MENTAL.map((tpl, i) => tpl.build(mulberry32(days * 9000 + i + 1)));

  const result = [];
  if(formules.length){
    const idx = ((days % formules.length) + formules.length) % formules.length;
    result.push(formules[idx]);
  }
  if(calculTemplated.length){
    const idx = days % calculTemplated.length;
    result.push(calculTemplated[idx]);
  }
  if(mentalTemplated.length){
    const idx = days % mentalTemplated.length;
    result.push(mentalTemplated[idx]);
  }
  return result;
}

const ACCESS_STORAGE_KEY = 'automatismes_access_code';
const accessGate = document.getElementById('accessGate');
const appWrap = document.getElementById('appWrap');
const accessCodeInput = document.getElementById('accessCodeInput');
const accessSubmitBtn = document.getElementById('accessSubmitBtn');
const accessError = document.getElementById('accessError');

function unlockApp(){
  accessGate.classList.add('hidden');
  appWrap.classList.remove('hidden');
}

function lockApp(message){
  localStorage.removeItem(ACCESS_STORAGE_KEY);
  appWrap.classList.add('hidden');
  accessGate.classList.remove('hidden');
  if(message){
    accessError.textContent = message;
    accessError.classList.remove('hidden');
  }
}

async function tryAccessCode(code){
  accessSubmitBtn.disabled = true;
  accessSubmitBtn.innerHTML = '<span class="spinner"></span> Vérification…';
  accessError.classList.add('hidden');
  try{
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ action: 'verify', code })
    });
    const data = await res.json().catch(() => ({}));
    if(res.ok && data.ok){
      localStorage.setItem(ACCESS_STORAGE_KEY, code);
      unlockApp();
    }else{
      accessError.textContent = 'Code incorrect, réessaie.';
      accessError.classList.remove('hidden');
    }
  }catch(e){
    accessError.textContent = "Impossible de vérifier le code, réessaie.";
    accessError.classList.remove('hidden');
  }finally{
    accessSubmitBtn.disabled = false;
    accessSubmitBtn.textContent = 'Valider';
  }
}

accessSubmitBtn.addEventListener('click', () => {
  const code = accessCodeInput.value.trim();
  if(code) tryAccessCode(code);
});
accessCodeInput.addEventListener('keypress', (e) => {
  if(e.key === 'Enter') accessSubmitBtn.click();
});

const savedAccessCode = localStorage.getItem(ACCESS_STORAGE_KEY);
if(savedAccessCode){
  accessCodeInput.value = savedAccessCode;
  tryAccessCode(savedAccessCode);
}

function fileToCompressedBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1000;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.72).split(',')[1]);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderQuestion(){
  const q = todayQuestions[currentIndex];
  document.getElementById('questionCard').innerHTML = `<span class="type-badge">${typeLabels[q.type]||q.type}</span><p class="enonce">${q.enonce}</p>`;
  photoSection.classList.remove('hidden');
  thumb.classList.add('hidden');
  thumb.src = '';
  photoInput.value = '';
  currentFile = null;
  sendBtn.disabled = true;
  sendBtn.innerHTML = 'Envoyer pour correction';
  sendError.classList.add('hidden');
  document.getElementById('correctionSection').classList.add('hidden');
  document.getElementById('correctionSection').innerHTML = '';
}

sendBtn.addEventListener('click', async () => {
  const q = todayQuestions[currentIndex];
  if(!currentFile) return;
  sendError.classList.add('hidden');
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="spinner"></span> Correction en cours…';
  try{
    const base64 = await fileToCompressedBase64(currentFile);
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        code: localStorage.getItem(ACCESS_STORAGE_KEY) || '',
        enonce: q.enonce,
        reponse: q.reponse,
        image: base64,
        mimeType: 'image/jpeg'
      })
    });
    if(res.status === 401){
      lockApp("Ton code d'accès n'est plus valide, redemande-le à ton professeur.");
      return;
    }
    if(!res.ok) throw new Error('Erreur serveur (' + res.status + ')');
    const result = await res.json();
    if(result.error) throw new Error(result.error);
    showAiFeedback(result);
  }catch(err){
    sendError.textContent = "La correction a échoué. Vérifie ta connexion et réessaie.";
    sendError.classList.remove('hidden');
    sendBtn.disabled = false;
    sendBtn.innerHTML = 'Envoyer pour correction';
  }
});

function showAiFeedback(result){
  const q = todayQuestions[currentIndex];
  const isLast = currentIndex === todayQuestions.length - 1;
  const icons = {correct: '&#10003;', partiel: '&#8776;', incorrect: '&#10005;'};
  const titles = {correct: 'Correct', partiel: 'Partiellement correct', incorrect: 'À revoir'};
  const statut = result.statut || 'incorrect';
  photoSection.classList.add('hidden');
  document.getElementById('correctionSection').innerHTML = `
    <p class="label">Correction</p>
    <div class="ai-feedback ${statut}">
      <p class="fb-status">${icons[statut]||''} ${titles[statut]||statut}</p>
      <p class="fb-text">${result.retour||''}</p>
      <p class="fb-lu">Ce que l'IA a lu sur ta photo : « ${result.lu||''} »</p>
    </div>
    <div class="correction-card" style="margin-top:10px;"><p class="cc-label">Corrigé de référence</p><p>${q.reponse}</p></div>
    <button class="btn btn-primary" id="nextBtn" style="margin-top:12px;">${isLast ? 'Terminer' : 'Question suivante'}</button>
  `;
  document.getElementById('correctionSection').classList.remove('hidden');

  document.getElementById('nextBtn').addEventListener('click', () => {
    if(isLast){
      currentIndex++;
      quizArea.classList.add('hidden');
      doneArea.classList.remove('hidden');
      heroTitle.textContent = 'Terminé pour aujourd\'hui';
    }else{
      currentIndex++;
      renderQuestion();
    }
  });
}
