<title>Automatismes du jour — 1re</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap');

:root{
  --bg:#16242A;
  --bg-2:#1E2F35;
  --line:rgba(241,238,228,0.10);
  --chalk:#F1EEE4;
  --chalk-dim:#AEBBB8;
  --teal:#5FC3B5;
  --teal-dim:#3A8B7F;
  --amber:#E8B84B;
  --paper:#FBF8F1;
  --paper-line:#D8D2C0;
  --ink:#22344A;
  --ink-dim:#5B6B80;
  --red-margin:#C1503F;
  --success:#4C9A6B;
  --success-bg:#DCEEE1;
  --radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;}
.wrap{max-width:640px;margin:0 auto;padding:0 0 4rem;}
.topbar{padding:1.4rem 1.25rem 1rem;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
.brand .bolt{color:var(--amber);font-size:20px;}

.hero{margin:0 1.25rem 1.25rem;background:var(--bg-2);border-radius:var(--radius);padding:1.3rem 1.4rem;position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle, rgba(95,195,181,0.12), transparent 70%);}
.hero .date{font-family:'Caveat',cursive;font-size:22px;color:var(--teal);margin:0 0 6px;}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:600;margin:0 0 12px;line-height:1.3;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;padding:4px 11px;border-radius:20px;background:rgba(95,195,181,0.14);color:var(--teal);border:1px solid rgba(95,195,181,0.25);font-weight:500;}

.section{margin:0 1.25rem 1.25rem;}
.label{font-size:12.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--chalk-dim);margin:0 0 8px;font-weight:600;}

.paper-card{
  background-image:linear-gradient(var(--paper-line) 1px, transparent 1px),linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
  background-size:22px 22px;background-color:var(--paper);border-radius:10px;padding:1.4rem 1.4rem 1.4rem 2.2rem;
  position:relative;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,0.25);
}
.paper-card::before{content:"";position:absolute;left:1.5rem;top:0;bottom:0;width:1.5px;background:var(--red-margin);opacity:0.55;}
.paper-card .type-badge{display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-dim);margin-bottom:8px;}
.paper-card .enonce{font-size:16.5px;line-height:1.55;font-weight:500;}

.photo-zone{border:1.5px dashed var(--line);border-radius:12px;padding:1.4rem;text-align:center;cursor:pointer;transition:border-color .15s ease;}
.photo-zone:hover{border-color:var(--teal-dim);}
.photo-zone .icon{font-size:26px;color:var(--teal);margin-bottom:6px;}
.photo-zone p{margin:0;font-size:13.5px;color:var(--chalk-dim);}
.thumb{width:100%;border-radius:10px;margin-top:12px;max-height:280px;object-fit:contain;background:#0e1a1e;}

.btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;padding:11px 18px;border-radius:9px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease, opacity .15s ease;width:100%;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--teal);color:#0C2621;}
.btn-primary:hover{background:#6FD0C2;}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}

.correction-card{background:var(--success-bg);border-left:4px solid var(--success);border-radius:12px;padding:1.1rem 1.2rem;margin-top:1rem;color:#1E4A31;}
.correction-card .cc-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;margin-bottom:6px;}
.correction-card p{margin:0;font-size:14.5px;line-height:1.55;}

.hidden{display:none !important;}

.progress-row{display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.progress-dots{display:flex;gap:6px;}
.progress-dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
.progress-dot.done{background:var(--teal);}
.progress-dot.current{background:var(--amber);}

.done-card{background:var(--bg-2);border-radius:12px;padding:1.6rem 1.4rem;text-align:center;}
.done-card .big{font-size:30px;margin-bottom:8px;}
.done-card p{margin:0;color:var(--chalk-dim);font-size:14.5px;}

.thumb{width:100%;border-radius:10px;margin-top:12px;max-height:280px;object-fit:contain;background:#0e1a1e;}
.spinner{
  width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);
  border-top-color:#0C2621;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.ai-feedback{border-radius:12px;padding:1.1rem 1.2rem;margin-top:1rem;border-left:4px solid;}
.ai-feedback.correct{background:var(--success-bg);border-color:var(--success);color:#1E4A31;}
.ai-feedback.partiel{background:#F4E7CC;border-color:#C08A2E;color:#4A3410;}
.ai-feedback.incorrect{background:#F6DEDA;border-color:#B7473A;color:#4A1D16;}
.ai-feedback .fb-status{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;margin-bottom:6px;}
.ai-feedback .fb-text{font-size:14.5px;line-height:1.55;margin:0 0 10px;}
.ai-feedback .fb-lu{font-size:12.5px;opacity:0.75;margin:0;border-top:1px solid rgba(0,0,0,0.12);padding-top:8px;}
.error-msg{color:#E8827A;font-size:13px;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand"><span class="bolt">&#9889;</span> Automatismes du jour</div>
  </div>

  <div class="hero">
    <p class="date" id="dateLabel"></p>
    <h1 id="heroTitle">C'est parti !</h1>
    <div class="chips" id="heroChips"></div>
  </div>

  <div class="section hidden" id="quizArea">

    <div class="section" style="margin:0 0 1.25rem;">
      <p class="label">La question</p>
      <div class="paper-card" id="questionCard"></div>
    </div>

    <div class="section" style="margin:0 0 1.25rem;" id="photoSection">
      <p class="label">Ta réponse</p>
      <div class="photo-zone" id="photoZone">
        <div class="icon">&#128247;</div>
        <p>Prends en photo ta réponse manuscrite</p>
        <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">
      </div>
      <img id="thumb" class="thumb hidden">
      <button class="btn btn-primary" id="sendBtn" style="margin-top:14px;" disabled>Envoyer pour correction</button>
      <p class="error-msg hidden" id="sendError"></p>
    </div>

    <div class="section hidden" style="margin:0;" id="correctionSection"></div>
  </div>

  <div class="section hidden" id="doneArea">
    <div class="done-card">
      <div class="big">&#127881;</div>
      <p>Bravo, tu as terminé les questions du jour !</p>
    </div>
  </div>

</div>

<script>
/*
  BANQUE DE QUESTIONS — 1re
  ----------------------------------------------------
  Pour ajouter une question, copiez un bloc { ... } et modifiez le texte
  entre guillemets. N'oubliez pas la virgule à la fin de chaque bloc,
  sauf le tout dernier.

  type     : "formule", "calcul" ou "definition"
  theme    : le chapitre concerné (sert aussi à mélanger les thèmes)
  niveau   : laissez "1re" (ce fichier est dédié à ce niveau)
  enonce   : la consigne donnée à l'élève
  reponse  : la réponse affichée pour l'autocorrection
  periode  : OPTIONNEL. Date "jj/mm" à partir de laquelle la question peut
             apparaître, comptée sur l'année scolaire en cours (1er
             septembre - 1er juillet). Exemple : periode:"23/10" -> la

// Générateur pseudo-aléatoire déterministe (mêmes nombres pour tout le monde le même jour).
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randInt(rand, min, max){ return min + Math.floor(rand() * (max - min + 1)); }
function randStep(rand, min, max, step){
  const n = Math.floor((max - min) / step) + 1;
  return min + step * Math.floor(rand() * n);
}
function fmt(num, decimals){
  let s = num.toFixed(decimals);
  if(s.indexOf('.') !== -1){
    s = s.replace(/0+$/, '').replace(/\.$/, '');
  }
  return s.replace('.', ',');
}

// Convertit un nombre en écriture scientifique a×10^b (a entre 1 et 10),
// avec l'exposant écrit en exposant unicode (ex: 4,50×10⁻³).
function toScientificParts(num){
  const s = num.toExponential(2);
  const [mantissaStr, expStr] = s.split('e');
  return { mantissa: parseFloat(mantissaStr), exponent: parseInt(expStr, 10) };
}
function superscript(n){
  const map = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
  return String(n).split('').map(ch => map[ch] || ch).join('');
}
function sciNotation(num){
  const { mantissa, exponent } = toScientificParts(num);
  return `${fmt(mantissa, 2)}×10${superscript(exponent)}`;
}

// L'année scolaire commence le 1er septembre. Si on est entre janvier et
// août, elle a commencé le 1er septembre de l'année précédente.
function getSchoolYearStart(now){
  const year = now.getFullYear();
  const sept1ThisYear = new Date(year, 8, 1);
  return now >= sept1ThisYear ? sept1ThisYear : new Date(year - 1, 8, 1);
}

// Transforme une date "jj/mm" en vraie date, en la plaçant dans la bonne
// année civile selon l'année scolaire en cours (sept-déc -> même année que
// la rentrée, janv-juil -> année suivante).
function resolvePeriodeDate(schoolYearStart, periode){
  const parts = periode.split('/');
  const day = parseInt(parts[0], 10);
  const month = parseInt(parts[1], 10);
  const startYear = schoolYearStart.getFullYear();
  const calYear = (month >= 9) ? startYear : startYear + 1;
  return new Date(calYear, month - 1, day);
}

// Une question sans champ "periode" est toujours disponible. Avec un champ
// "periode", elle n'apparaît qu'à partir de cette date de l'année scolaire.
function isAvailable(q, now, schoolYearStart){
  if(!q.periode) return true;
  return now >= resolvePeriodeDate(schoolYearStart, q.periode);
}

// Chaque jour, 3 questions dans un ordre fixe : une définition, une
// manipulation algébrique littérale (formule), un calcul numérique de
// conversion d'unité + écriture scientifique. Les deux premières tournent
// dans l'ordre où elles sont écrites dans la banque (QUESTIONS) ; la
// troisième est régénérée avec des nombres nouveaux chaque jour, donc elle
// ne se répète jamais vraiment. Les questions non encore ouvertes (champ
// "periode") sont ignorées.
function getTodayQuestions(){
  const epoch = new Date(2026, 0, 1);
  const now = new Date();
  const days = Math.floor((now - epoch) / 86400000);
  const schoolYearStart = getSchoolYearStart(now);

  const definitions = QUESTIONS.filter(q => q.type === 'definition' && isAvailable(q, now, schoolYearStart));
  const formules = QUESTIONS.filter(q => q.type === 'formule' && isAvailable(q, now, schoolYearStart));
  const calculTemplated = TEMPLATES_CALCUL.map((tpl, i) => tpl.build(mulberry32(days * 5000 + i + 1)));

  const result = [];
  if(definitions.length){
    const idx = ((days % definitions.length) + definitions.length) % definitions.length;
    result.push(definitions[idx]);
  }
  if(formules.length){
    const idx = ((days % formules.length) + formules.length) % formules.length;
    result.push(formules[idx]);
  }
  if(calculTemplated.length){
    const idx = days % calculTemplated.length;
    result.push(calculTemplated[idx]);
  }
  return result;
}

let todayQuestions = [];
let currentIndex = 0;

const quizArea = document.getElementById('quizArea');
const doneArea = document.getElementById('doneArea');
const heroTitle = document.getElementById('heroTitle');
const heroChips = document.getElementById('heroChips');

function start(){
  todayQuestions = getTodayQuestions();
  currentIndex = 0;
  if(todayQuestions.length === 0){
    heroTitle.textContent = "Pas encore de question disponible.";
    return;
  }
  quizArea.classList.remove('hidden');
  heroTitle.textContent = "C'est parti !";
  heroChips.innerHTML = `<span class="chip">1re</span><span class="chip">${todayQuestions.length} question${todayQuestions.length>1?'s':''} aujourd'hui</span>`;
  renderQuestion();
}

const API_ENDPOINT = "https://automatismes-correction.cedric-vandendriessche.workers.dev";

const photoSection = document.getElementById('photoSection');
const photoZone = document.getElementById('photoZone');
const photoInput = document.getElementById('photoInput');
const thumb = document.getElementById('thumb');
const sendBtn = document.getElementById('sendBtn');
const sendError = document.getElementById('sendError');
let currentFile = null;

photoZone.addEventListener('click', () => photoInput.click());
photoInput.addEventListener('change', () => {
  if(photoInput.files && photoInput.files[0]){
    currentFile = photoInput.files[0];
    thumb.src = URL.createObjectURL(currentFile);
    thumb.classList.remove('hidden');
    sendBtn.disabled = false;
  }
});

function fileToCompressedBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1000;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.72).split(',')[1]);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderQuestion(){
  const q = todayQuestions[currentIndex];
  document.getElementById('questionCard').innerHTML = `<span class="type-badge">${typeLabels[q.type]||q.type}</span><p class="enonce">${q.enonce}</p>`;
  photoSection.classList.remove('hidden');
  thumb.classList.add('hidden');
  thumb.src = '';
  photoInput.value = '';
  currentFile = null;
  sendBtn.disabled = true;
  sendBtn.innerHTML = 'Envoyer pour correction';
  sendError.classList.add('hidden');
  document.getElementById('correctionSection').classList.add('hidden');
  document.getElementById('correctionSection').innerHTML = '';
}

sendBtn.addEventListener('click', async () => {
  const q = todayQuestions[currentIndex];
  if(!currentFile) return;
  sendError.classList.add('hidden');
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="spinner"></span> Correction en cours…';
  try{
    const base64 = await fileToCompressedBase64(currentFile);
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        enonce: q.enonce,
        reponse: q.reponse,
        image: base64,
        mimeType: 'image/jpeg'
      })
    });
    if(!res.ok) throw new Error('Erreur serveur (' + res.status + ')');
    const result = await res.json();
    if(result.error) throw new Error(result.error);
    showAiFeedback(result);
  }catch(err){
    sendError.textContent = "La correction a échoué. Vérifie ta connexion et réessaie.";
    sendError.classList.remove('hidden');
    sendBtn.disabled = false;
    sendBtn.innerHTML = 'Envoyer pour correction';
  }
});

function showAiFeedback(result){
  const q = todayQuestions[currentIndex];
  const isLast = currentIndex === todayQuestions.length - 1;
  const icons = {correct: '&#10003;', partiel: '&#8776;', incorrect: '&#10005;'};
  const titles = {correct: 'Correct', partiel: 'Partiellement correct', incorrect: 'À revoir'};
  const statut = result.statut || 'incorrect';
  photoSection.classList.add('hidden');
  document.getElementById('correctionSection').innerHTML = `
    <p class="label">Correction</p>
    <div class="ai-feedback ${statut}">
      <p class="fb-status">${icons[statut]||''} ${titles[statut]||statut}</p>
      <p class="fb-text">${result.retour||''}</p>
      <p class="fb-lu">Ce que l'IA a lu sur ta photo : « ${result.lu||''} »</p>
    </div>
    <div class="correction-card" style="margin-top:10px;"><p class="cc-label">Corrigé de référence</p><p>${q.reponse}</p></div>
    <button class="btn btn-primary" id="nextBtn" style="margin-top:12px;">${isLast ? 'Terminer' : 'Question suivante'}</button>
  `;
  document.getElementById('correctionSection').classList.remove('hidden');

  document.getElementById('nextBtn').addEventListener('click', () => {
    if(isLast){
      currentIndex++;
      quizArea.classList.add('hidden');
      doneArea.classList.remove('hidden');
      heroTitle.textContent = 'Terminé pour aujourd\'hui';
    }else{
      currentIndex++;
      renderQuestion();
    }
  });
}

start();

  });
